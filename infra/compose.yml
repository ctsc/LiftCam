services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: liftcam
      POSTGRES_PASSWORD: liftcam
      POSTGRES_DB: liftcam
    # Host port 5433 so this never collides with a Postgres installed on the machine.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liftcam -d liftcam"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
